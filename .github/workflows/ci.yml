name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      AGENT_MODE: mock
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      MIGRATION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-eval.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest tests/ --ignore=tests/test_knowledgebase.py -v

      - name: Build Docker image
        run: |
          docker build -t multitenant:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name multitenant-smoke \
            --network host \
            -e APP_ENV=test \
            -e AGENT_MODE=mock \
            -e DATABASE_URL="${DATABASE_URL}" \
            multitenant:${{ github.sha }}

      - name: Smoke test container
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Container health check passed"
              exit 0
            fi

            echo "Waiting for application to start... ($i/30)"
            sleep 2
          done

          echo "Container failed to become healthy"
          docker logs multitenant-smoke
          exit 1

      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f multitenant-smoke || true
