services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: multi_tenant_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: blah123
      POSTGRES_DB: multi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: